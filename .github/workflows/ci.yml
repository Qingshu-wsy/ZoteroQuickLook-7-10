name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check .\bootstrap.js
          node --check .\preferences.js
      - name: Validate preferences XML
        shell: pwsh
        run: |
          [xml]$preferences = Get-Content .\preferences.xhtml -Raw -Encoding UTF8
      - name: Build XPI
        shell: pwsh
        run: .\scripts\build-xpi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-quicklook-xpi
          path: dist/*.xpi
