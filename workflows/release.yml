name: Publish Zotero add-on release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag and sources
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content .\manifest.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($manifest.version)") {
            throw "Release tag must match manifest version v$($manifest.version)."
          }
          node --check .\bootstrap.js
          node --check .\preferences.js
          [xml]$preferences = Get-Content .\preferences.xhtml -Raw -Encoding UTF8
      - name: Build release files
        shell: pwsh
        run: |
          .\scripts\build-xpi.ps1
          .\scripts\build-update-manifest.ps1 -Repository "shanyueWei/Zotero-QuickLook-7-10"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $manifest = Get-Content .\manifest.json -Raw | ConvertFrom-Json
          $xpi = ".\dist\ZoteroQuicklook-$($manifest.version).xpi"
          gh release create $env:RELEASE_TAG $xpi .\dist\updates.json --title $env:RELEASE_TAG --generate-notes
